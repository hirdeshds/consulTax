# Netlify Configuration for ConsulTax Monorepo

[build]
  base = "frontend"
  publish = "out"
  command = "npm run build"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://consultax.onrender.com/api"

# Redirects for single-page applications (SPA / client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
